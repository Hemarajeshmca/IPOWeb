name: Deploy IPOWeb to Local IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify .NET SDK
        shell: cmd
        run: dotnet --info

      - name: Restore Packages
        shell: cmd
        run: dotnet restore IPOWeb.sln

      - name: Build Project
        shell: cmd
        run: dotnet build IPOWeb.sln --configuration Release --no-restore

      - name: Clean Publish Folder
        shell: powershell
        run: |
          if (Test-Path "D:\Publish\ipoweb") {
              Remove-Item "D:\Publish\ipoweb\*" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Publish Project
        shell: cmd
        run: dotnet publish IPOWeb.csproj --configuration Release --output D:\Publish\ipoweb

      - name: Runner Identity
  	shell: powershell
  	run: |
    	whoami
    	[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
    	$PSVersionTable.PSVersion

      - name: Test IIS Access
  	shell: powershell
  	run: |
    	Import-Module WebAdministration
    	Get-WebAppPoolState -Name "ipoweb"

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "ipoweb").Value -eq "Started") {
              Stop-WebAppPool -Name "ipoweb"
          }

      - name: Deploy to IIS
        shell: cmd
        run: |
          robocopy D:\Publish\ipoweb D:\inetpub\wwwroot\ipoweb /MIR
          if %ERRORLEVEL% LEQ 3 exit /b 0
          exit /b %ERRORLEVEL%

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "ipoweb"

      - name: Verify IIS Site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Get-WebAppPoolState -Name "ipoweb"